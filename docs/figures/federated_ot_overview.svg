<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#102a43">Federated WGAN-GP anomaly detection across industrial sites</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#52606d">Raw process data stays inside each plant. Only autoencoder weights cross the IT/OT boundary.</text>

  <!-- OT region -->
  <rect x="20" y="70" width="640" height="320" rx="10" fill="#eef4f0" stroke="#8fae98" stroke-width="1.5"/>
  <text x="34" y="92" font-size="14" font-weight="700" fill="#2e5d3b">OT zone: industrial plants (Purdue levels 0 to 3)</text>

  <!-- Site 1: water treatment -->
  <g>
    <rect x="34" y="104" width="190" height="130" rx="8" fill="#ffffff" stroke="#9db7a5"/>
    <rect x="48" y="150" width="34" height="56" fill="#b3e5fc" stroke="#0277bd" stroke-width="1.5"/>
    <rect x="48" y="150" width="34" height="18" fill="#ffffff" opacity="0.6"/>
    <rect x="96" y="160" width="34" height="46" fill="#b3e5fc" stroke="#0277bd" stroke-width="1.5"/>
    <rect x="96" y="160" width="34" height="14" fill="#ffffff" opacity="0.6"/>
    <rect x="144" y="170" width="34" height="36" fill="#b3e5fc" stroke="#0277bd" stroke-width="1.5"/>
    <rect x="144" y="170" width="34" height="10" fill="#ffffff" opacity="0.6"/>
    <path d="M82,200 L96,200 M130,200 L144,200 M178,200 L196,200 L196,212" fill="none" stroke="#0277bd" stroke-width="3"/>
    <circle cx="196" cy="216" r="7" fill="#fff" stroke="#0277bd" stroke-width="2"/>
    <text x="129" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#102a43">Water treatment</text>
    <text x="129" y="140" text-anchor="middle" font-size="11" fill="#52606d">SWaT: tanks, pumps, valves</text>
    <rect x="48" y="214" width="34" height="14" rx="3" fill="#ffe082" stroke="#f9a825"/><text x="65" y="225" text-anchor="middle" font-size="9" fill="#5d4037">PLC</text>
  </g>

  <!-- Site 2: power -->
  <g>
    <rect x="240" y="104" width="190" height="130" rx="8" fill="#ffffff" stroke="#9db7a5"/>
    <rect x="256" y="160" width="80" height="48" fill="#cfd8dc" stroke="#546e7a" stroke-width="1.5"/>
    <rect x="266" y="168" width="14" height="14" fill="#90a4ae"/><rect x="288" y="168" width="14" height="14" fill="#90a4ae"/><rect x="310" y="168" width="14" height="14" fill="#90a4ae"/>
    <rect x="344" y="144" width="18" height="64" fill="#b0bec5" stroke="#546e7a" stroke-width="1.5"/>
    <path d="M353,140 Q362,128 356,118" fill="none" stroke="#b0bec5" stroke-width="5" stroke-linecap="round"/>
    <path d="M388,150 L398,206 M408,150 L398,206 M382,162 L414,162 M386,174 L410,174" fill="none" stroke="#546e7a" stroke-width="2"/>
    <text x="335" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#102a43">Power generation</text>
    <text x="335" y="140" text-anchor="middle" font-size="11" fill="#52606d">HAI: boiler, turbine, grid</text>
    <rect x="256" y="214" width="34" height="14" rx="3" fill="#ffe082" stroke="#f9a825"/><text x="273" y="225" text-anchor="middle" font-size="9" fill="#5d4037">PLC</text>
  </g>

  <!-- Site 3: distribution -->
  <g>
    <rect x="446" y="104" width="200" height="130" rx="8" fill="#ffffff" stroke="#9db7a5"/>
    <path d="M466,200 L520,200 L520,160 L586,160 M520,200 L586,200 L586,180 L626,180 M586,160 L626,150" fill="none" stroke="#0277bd" stroke-width="3"/>
    <circle cx="466" cy="200" r="9" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>
    <circle cx="520" cy="180" r="6" fill="#fff" stroke="#0277bd" stroke-width="2"/>
    <circle cx="586" cy="160" r="6" fill="#fff" stroke="#0277bd" stroke-width="2"/>
    <circle cx="586" cy="200" r="6" fill="#fff" stroke="#0277bd" stroke-width="2"/>
    <rect x="618" y="136" width="20" height="30" fill="#b3e5fc" stroke="#0277bd" stroke-width="1.5"/>
    <text x="546" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#102a43">Water distribution</text>
    <text x="546" y="140" text-anchor="middle" font-size="11" fill="#52606d">BATADAL: pipes, pumps, tanks</text>
    <rect x="462" y="214" width="34" height="14" rx="3" fill="#ffe082" stroke="#f9a825"/><text x="479" y="225" text-anchor="middle" font-size="9" fill="#5d4037">PLC</text>
  </g>

  <!-- edge clients -->
  <g font-size="11" text-anchor="middle">
    <rect x="34" y="248" width="190" height="126" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="129" y="268" font-size="13" font-weight="700" fill="#0d47a1">Edge client C1</text>
    <text x="129" y="288" fill="#37474f">trains on real data only</text>
    <text x="129" y="306" fill="#37474f">autoencoder (64-32-64)</text>
    <text x="129" y="324" fill="#37474f">IQR threshold, no tuning</text>
    <text x="129" y="346" fill="#b71c1c" font-weight="700">raw data never leaves</text>
    <text x="129" y="362" fill="#b71c1c" font-weight="700">this box</text>

    <rect x="240" y="248" width="190" height="126" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="335" y="268" font-size="13" font-weight="700" fill="#0d47a1">Edge client C2</text>
    <text x="335" y="288" fill="#37474f">real data + WGAN-GP</text>
    <text x="335" y="306" fill="#37474f">synthetic attack samples</text>
    <text x="335" y="324" fill="#37474f">fixes the class imbalance</text>
    <text x="335" y="346" fill="#b71c1c" font-weight="700">generator stays local</text>

    <rect x="446" y="248" width="200" height="126" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="546" y="268" font-size="13" font-weight="700" fill="#0d47a1">Edge client C3</text>
    <text x="546" y="288" fill="#37474f">trains on synthetic data</text>
    <text x="546" y="306" fill="#37474f">only (WGAN-GP output)</text>
    <text x="546" y="324" fill="#37474f">tests transfer to real attacks</text>
    <text x="546" y="346" fill="#b71c1c" font-weight="700">generator stays local</text>
  </g>
  <g stroke="#546e7a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)">
    <line x1="129" y1="234" x2="129" y2="246"/><line x1="335" y1="234" x2="335" y2="246"/><line x1="546" y1="234" x2="546" y2="246"/>
  </g>

  <!-- DMZ -->
  <rect x="664" y="70" width="46" height="320" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text transform="translate(693,330) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">IT / OT DMZ</text>

  <!-- IT region -->
  <rect x="724" y="70" width="256" height="320" rx="10" fill="#f3effa" stroke="#9575cd" stroke-width="1.5"/>
  <text x="738" y="92" font-size="14" font-weight="700" fill="#4527a0">IT zone: enterprise network</text>
  <rect x="756" y="130" width="192" height="120" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <rect x="772" y="146" width="160" height="14" rx="3" fill="#b39ddb"/><rect x="772" y="166" width="160" height="14" rx="3" fill="#b39ddb"/><rect x="772" y="186" width="160" height="14" rx="3" fill="#b39ddb"/>
  <circle cx="920" cy="153" r="3" fill="#2e7d32"/><circle cx="920" cy="173" r="3" fill="#2e7d32"/><circle cx="920" cy="193" r="3" fill="#2e7d32"/>
  <text x="852" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#311b92">Aggregation server</text>
  <text x="852" y="242" text-anchor="middle" font-size="12" fill="#37474f">FedAvg, global autoencoder</text>
  <text x="852" y="300" text-anchor="middle" font-size="12" fill="#37474f">Sees weight updates only.</text>
  <text x="852" y="318" text-anchor="middle" font-size="12" fill="#37474f">No sensor data, no generator.</text>
  <text x="852" y="352" text-anchor="middle" font-size="12" fill="#37474f">3 clients, 10 rounds:</text>
  <text x="852" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#311b92">about 2 MB in total (SWaT)</text>

  <!-- exchange arrows through DMZ -->
  <g stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrb)">
    <path d="M335,376 L335,384 L360,384" fill="none" stroke-width="0"/>
    <line x1="648" y1="170" x2="754" y2="170"/>
  </g>
  <g stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrb)">
    <line x1="754" y1="214" x2="648" y2="214"/>
  </g>
  <text x="702" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">weights</text>
  <text x="702" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">global</text>

  <!-- pipeline -->
  <text x="500" y="424" text-anchor="middle" font-size="16" font-weight="700" fill="#102a43">What each plant runs locally</text>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="438" width="170" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="105" y="462" font-weight="700" fill="#1b5e20">Process telemetry</text>
    <text x="105" y="482" fill="#37474f">SCADA and PLC readings</text>
    <text x="105" y="498" fill="#37474f">attacks below 1% of</text>
    <text x="105" y="514" fill="#37474f">the data on SWaT</text>

    <rect x="214" y="438" width="170" height="90" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
    <text x="299" y="462" font-weight="700" fill="#e65100">WGAN-GP generator</text>
    <text x="299" y="482" fill="#37474f">makes realistic attack</text>
    <text x="299" y="498" fill="#37474f">samples, kept inside</text>
    <text x="299" y="514" fill="#37474f">physical limits (tanh)</text>

    <rect x="408" y="438" width="170" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="493" y="462" font-weight="700" fill="#0d47a1">Autoencoder</text>
    <text x="493" y="482" fill="#37474f">learns what normal looks</text>
    <text x="493" y="498" fill="#37474f">like, the only part that</text>
    <text x="493" y="514" fill="#37474f">is shared in training</text>

    <rect x="602" y="438" width="170" height="90" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="687" y="462" font-weight="700" fill="#4a148c">IQR threshold</text>
    <text x="687" y="482" fill="#37474f">reconstruction error above</text>
    <text x="687" y="498" fill="#37474f">the limit means attack,</text>
    <text x="687" y="514" fill="#37474f">calibrated automatically</text>

    <rect x="796" y="438" width="184" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
    <text x="888" y="462" font-weight="700" fill="#b71c1c">Operator alert</text>
    <text x="888" y="482" fill="#37474f">anomaly flagged inside</text>
    <text x="888" y="498" fill="#37474f">the plant, within the</text>
    <text x="888" y="514" fill="#37474f">segmentation rules</text>
  </g>
  <g stroke="#37474f" stroke-width="2" marker-end="url(#arr)">
    <line x1="190" y1="483" x2="212" y2="483"/><line x1="384" y1="483" x2="406" y2="483"/>
    <line x1="578" y1="483" x2="600" y2="483"/><line x1="772" y1="483" x2="794" y2="483"/>
  </g>

  <!-- results -->
  <rect x="20" y="556" width="960" height="104" rx="8" fill="#f5f7fa" stroke="#cfd8dc"/>
  <text x="500" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#52606d">SWaT, the most imbalanced dataset: what WGAN-GP adds</text>
  <g text-anchor="middle">
    <text x="130" y="620" font-size="24" font-weight="700" fill="#c62828">19.6%</text><text x="130" y="640" font-size="12" fill="#52606d">recall without WGAN-GP</text>
    <text x="330" y="620" font-size="24" font-weight="700" fill="#2e7d32">77.5%</text><text x="330" y="640" font-size="12" fill="#52606d">recall with WGAN-GP</text>
    <text x="530" y="620" font-size="24" font-weight="700" fill="#1565c0">0.794</text><text x="530" y="640" font-size="12" fill="#52606d">F1 (best central baseline 0.791)</text>
    <text x="730" y="620" font-size="24" font-weight="700" fill="#1565c0">4</text><text x="730" y="640" font-size="12" fill="#52606d">datasets: SWaT, HAI, BATADAL, KDD99</text>
    <text x="910" y="620" font-size="24" font-weight="700" fill="#1565c0">205.6 KB</text><text x="910" y="640" font-size="12" fill="#52606d">per round on SWaT</text>
  </g>
</svg>
